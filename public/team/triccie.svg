  <path d="M140 50 Q148 40 158 50 Q148 58 140 50Z" fill="#ff4d88"/>
  <circle cx="140" cy="50" r="5" fill="#cc2266"/>
  <circle cx="140" cy="50" r="2.5" fill="#ff8ab4"/>

  <!-- Arched eyebrows -->
  <path d="M79 85 Q86 79 93 82" stroke="#5a3a22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M107 82 Q114 79 121 85" stroke="#5a3a22" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="86" cy="96" rx="7" ry="7" fill="#1d2235"/>
  <ellipse cx="114" cy="96" rx="7" ry="7" fill="#1d2235"/>

  <!-- Eye shine -->
  <circle cx="88.5" cy="93.5" r="2.2" fill="white"/>
  <circle cx="116.5" cy="93.5" r="2.2" fill="white"/>

  <!-- Eyelashes - left eye -->
  <line x1="79" y1="91" x2="77" y2="87" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="83" y1="89" x2="81" y2="85" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="86" y1="89" x2="86" y2="85" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="89" y1="89" x2="90" y2="85" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="93" y1="91" x2="95" y2="87" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Eyelashes - right eye -->
  <line x1="107" y1="91" x2="105" y2="87" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="111" y1="89" x2="110" y2="85" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="114" y1="89" x2="114" y2="85" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="117" y1="89" x2="118" y2="85" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="121" y1="91" x2="123" y2="87" stroke="#1d2235" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M97 110 Q100 115 103 110" stroke="#c98060" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Rosy cheeks -->
  <ellipse cx="72" cy="112" rx="13" ry="7" fill="#ff9999" opacity="0.4"/>
  <ellipse cx="128" cy="112" rx="13" ry="7" fill="#ff9999" opacity="0.4"/>

  <!-- Lips - feminine pink -->
  <path d="M88 122 Q94 118 100 120 Q106 118 112 122 Q106 130 100 131 Q94 130 88 122Z" fill="#e06070"/>
  <path d="M88 122 Q100 126 112 122" stroke="#b03050" stroke-width="0.8" fill="none"/>
  <path d="M88 122 Q94 119 100 120 Q106 119 112 122" stroke="#b03050" stroke-width="0.8" fill="none"/>
